<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>Soleil Couchant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--bg2:#0f1830;--card:#131d36;--card2:#18243f;--line:#22304f;--text:#f2f4fa;--muted:#8d9ab8;--gold:#e9b24c;--gold2:#f6cf7d;--ink:#1a1204}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;color:var(--gold)}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom));background:radial-gradient(120% 40% at 50% 0%,#18274a 0%,var(--bg) 70%)}
.pad{padding:0 18px}
header.top{padding:calc(18px + env(safe-area-inset-top)) 18px 6px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;flex:none}
header.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px}
header.top small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
h2.sec{font-size:17px;margin:26px 18px 12px;display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
h2.sec a,h2.sec button{font-size:13px;color:var(--gold);font-weight:600}
.btn{background:var(--gold);color:var(--ink);font-weight:700;padding:11px 18px;border-radius:999px;font-size:14px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.block{display:block;width:100%;padding:14px}
/* hero */
.hero{margin:14px 18px 0;border-radius:22px;overflow:hidden;position:relative;background:var(--card);border:1px solid var(--line)}
.hero .img{aspect-ratio:16/9;background-size:cover;background-position:center;background-color:#1b2a4d}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,#0a102000 30%,#0a1020ee 100%)}
.hero .in{position:absolute;left:16px;right:16px;bottom:14px}
.hero .tag{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold2);font-weight:700}
.hero .ht{font-size:18px;font-weight:700;line-height:1.25;margin:4px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px}
.hero .btn svg,.btn svg{width:16px;height:16px;fill:currentColor}
/* horizontal cards */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hcard{flex:none;width:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;scroll-snap-align:start;text-align:left}
.hcard .th{width:100%;aspect-ratio:16/9;border-radius:10px;background-size:cover;background-position:center;background-color:#1b2a4d}
.hcard .rt{font-size:13px;font-weight:600;margin:9px 0 8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prog{height:3px;background:#0006;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.hcard .rs{font-size:11px;color:var(--muted);margin-top:6px}
/* rows */
.list{padding:0 18px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;cursor:pointer}
.row:active{background:var(--card)}
.row.cur{background:var(--card2);box-shadow:inset 0 0 0 1px #e9b24c55}
.row .th{width:84px;height:48px;border-radius:9px;flex:none;background-size:cover;background-position:center;background-color:#1b2a4d;position:relative}
.row .rm{flex:1;min-width:0}
.row .rt{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .rs{font-size:12px;color:var(--muted);margin-top:3px}
.row .ic{padding:8px;color:var(--muted);flex:none}
.row .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.row .ic.on{color:var(--gold)}.row .ic.on svg{fill:var(--gold)}
.eq{position:absolute;right:5px;bottom:5px;display:flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--gold);border-radius:1px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.empty{text-align:center;color:var(--muted);padding:44px 28px;line-height:1.6;font-size:14px}
.empty .big{font-size:26px;margin-bottom:6px;display:block}
.empty .btn{margin-top:18px}
/* search */
.search{margin:18px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;padding:14px 0;font-size:15px}
/* library tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.tile .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.tile .ti svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.tile b{display:block;font-size:14px}.tile small{color:var(--muted);font-size:12px}
.tile.off{opacity:.5}
/* settings */
.set{margin:0 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.set button,.set .it{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.set>*:last-child{border-bottom:0}
.set span.v{color:var(--muted);font-size:13px}
.about{margin:22px 18px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}
/* tab bar */
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:flex;background:#0b1326f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0;font-weight:500}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--gold)}
/* mini player */
#mini{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 20px),500px);bottom:calc(68px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:8px 10px;display:none;align-items:center;gap:10px;z-index:19;box-shadow:0 10px 30px #0009;overflow:hidden}
#mini .th{width:44px;height:44px;border-radius:9px;background-size:cover;background-position:center;background-color:#1b2a4d;flex:none}
#mini .tt{flex:1;min-width:0;text-align:left}
#mini .tt b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .tt small{color:var(--muted);font-size:11px}
#mini .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:#0005}
#mini .bar i{display:block;height:100%;width:0;background:var(--gold)}
.round{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px;fill:currentColor}
/* full player */
#full{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#1b2b52 0%,#0a1020 55%);transform:translateY(100%);transition:transform .3s;overflow-y:auto;visibility:hidden}
#full.open{transform:none;visibility:visible}
#full .wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
.ptop{display:flex;justify-content:space-between;align-items:center}
.ptop .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff12}
.ptop .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2}
.ptop span{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
#media{margin:18px 0 16px;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:16/9;width:100%;box-shadow:0 16px 40px #0008}
#media iframe{width:100%;height:100%;border:0}
.cover{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 75%,#e9b24c,#7a4a12 50%,#0f1830)}
.cover svg{width:90px;height:90px}
#ftitle{font-size:20px;line-height:1.3;margin:0 0 4px;font-weight:700}
#fsub{color:var(--muted);font-size:13px;margin-bottom:16px}
input[type=range]{width:100%;accent-color:var(--gold);margin:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.ctrls{display:flex;justify-content:center;align-items:center;gap:16px;margin:16px 0 8px}
.ctrls .sk{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--gold2)}
.ctrls .nx{width:40px;height:40px;display:grid;place-items:center;color:#cfd7ec}
.ctrls .nx svg{width:24px;height:24px;fill:currentColor}
.ctrls .round{width:70px;height:70px}.ctrls .round svg{width:30px;height:30px}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold2)}
.chip.fav::before{display:none}
.queue{margin-top:20px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:14px 8px 8px}
.queue h3{margin:0 10px 8px;font-size:15px}
.note{font-size:11.5px;color:var(--muted);text-align:center;margin:16px 10px 0;line-height:1.5}
/* dialog */
dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:22px;padding:20px;width:min(92vw,440px)}
dialog::backdrop{background:#000b}
dialog h3{margin:0 0 6px}
dialog p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.5}
dialog textarea{width:100%;min-height:130px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px;resize:vertical}
dialog .row2{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="mini">
  <button class="th" id="miniTh" aria-label="Ouvrir le lecteur"></button>
  <button class="tt" id="miniOpen"><b id="miniT"></b><small>Pasteur Francis Tinona</small></button>
  <button class="round" id="miniPlay" aria-label="Lecture/Pause"></button>
  <div class="bar"><i id="miniBar"></i></div>
</div>
<nav class="tabs" id="tabs"></nav>

<section id="full" aria-label="Lecteur"><div class="wrap">
  <div class="ptop">
    <button class="ic" id="close" aria-label="Réduire"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <span>Prédication</span>
    <span style="width:40px"></span>
  </div>
  <div id="media"></div>
  <h2 id="ftitle"></h2>
  <div id="fsub">Pasteur Francis Tinona · Soleil Couchant Tabernacle</div>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
  <div class="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
  <div class="ctrls">
    <button class="nx" id="prev" aria-label="Précédente"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="sk" id="back">-15</button>
    <button class="round" id="play" aria-label="Lecture/Pause"></button>
    <button class="sk" id="fwd">+15</button>
    <button class="nx" id="next" aria-label="Suivante"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
  </div>
  <div class="chips">
    <button class="chip" id="rate">Vitesse 1x</button>
    <button class="chip" id="sleep">Minuteur</button>
    <button class="chip" id="rep">Répéter</button>
    <button class="chip fav" id="favBtn">♡ Favori</button>
  </div>
  <div class="queue"><h3>À écouter ensuite</h3><div class="list" id="queue"></div></div>
  <p class="note" id="note"></p>
</div></section>

<dialog id="dlg">
  <h3>Ajouter des prédications</h3>
  <p>Colle un lien YouTube par ligne. Le titre est récupéré automatiquement ; tu peux aussi l'écrire après le lien.</p>
  <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea>
  <div class="row2"><button class="btn ghost" id="cancel">Annuler</button><button class="btn" id="save">Ajouter</button></div>
</dialog>
<div id="toast"></div>

<script>
const PASTOR = 'Pasteur Francis Tinona';
const CHANNEL = 'https://youtube.com/@francistchinona';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};

/* ---------- DONNÉES ----------
   { id, title, yt }  -> prédication YouTube
   { id, title, audio } -> fichier mp3 hébergé (plus tard : voix ElevenLabs, autres langues)
   Tu peux pré-remplir ici, sinon on ajoute depuis l'appli. */
const DEFAULT_SERMONS = [];
let sermons = LS.get('sc_sermons', null) ?? DEFAULT_SERMONS;
let favs = LS.get('sc_favs', []);
let history = LS.get('sc_hist', []);
let settings = LS.get('sc_set', { rate: 1 });
const saveAll = () => { LS.set('sc_sermons', sermons); LS.set('sc_favs', favs); LS.set('sc_hist', history); LS.set('sc_set', settings); };

const I = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9C1.2 8.800 3 5.500 6.200 5.500c1.900 0 3.200 1 3.800 2.200.6-1.200 1.900-2.200 3.800-2.200 3.200 0 5 3.300 3.500 6.500C19 16.600 12 21 12 21z"/></svg>',
  home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  lib: '<svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.500 5l3.500 1-3.500 14-3.500-1z"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.1a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.1a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.1a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/></svg>',
  hist: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.700L3 8M3 3v5h5M12 7v5l3 2"/></svg>',
  dl: '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>',
  list: '<svg viewBox="0 0 24 24"><path d="M4 6h12M4 12h12M4 18h8M19 15v6m-3-3h6"/></svg>'
};
const SUN = '<svg viewBox="0 0 64 64"><circle cx="32" cy="38" r="20" fill="#f6cf7d"/><rect y="40" width="64" height="24" fill="#0f1830"/></svg>';
const LOGO = '<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf7d"/><stop offset="1" stop-color="#e08a2c"/></linearGradient></defs><circle cx="32" cy="36" r="20" fill="url(#lg)"/><rect y="38" width="64" height="26" fill="#0a1020"/><path d="M8 43h48M15 50h34M23 57h18" stroke="#e9b24c" stroke-width="3" stroke-linecap="round"/></svg>';

const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0');
};
const ytId = u => { const m = String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : null; };
const thumb = s => s.yt ? `style="background-image:url('https://i.ytimg.com/vi/${s.yt}/mqdefault.jpg')"` : '';
const pos = id => LS.get('sc_pos_' + id, 0);
const dur = id => LS.get('sc_dur_' + id, 0);
const pct = id => { const d = dur(id), p = pos(id); return d ? Math.min(100, p / d * 100) : 0; };
const byId = id => sermons.find(s => s.id === id);
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2200); }

/* ---------- ÉTAT & NAVIGATION ---------- */
let tab = 'home', query = '', libView = null;
let current = null, engine = null, playing = false, repeat = false, sleepAt = 0, sleepI = 0;
const RATES = [1, 1.25, 1.5, 0.75];
const TABS = [['home', 'Accueil', I.home], ['search', 'Recherche', I.search], ['lib', 'Bibliothèque', I.lib], ['set', 'Réglages', I.gear]];

function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, l, ic]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${ic}<span>${l}</span></button>`).join('');
}

function row(s, extra = '') {
  const isCur = current && current.id === s.id;
  const p = pct(s.id);
  const sub = extra && isCur ? extra : (p > 1 && p < 98 ? `Reprendre à ${fmt(pos(s.id))}` : PASTOR);
  return `<div class="row ${isCur ? 'cur' : ''}" data-play="${esc(s.id)}">
    <div class="th" ${thumb(s)}>${isCur && playing ? '<div class="eq"><i></i><i></i><i></i></div>' : ''}</div>
    <div class="rm"><div class="rt">${esc(s.title)}</div><div class="rs">${esc(sub)}</div></div>
    <button class="ic ${favs.includes(s.id) ? 'on' : ''}" data-fav="${esc(s.id)}" aria-label="Favori">${I.heart}</button></div>`;
}
const emptyBlock = `<div class="empty"><span class="big serif">Aucune prédication</span>Ajoute les liens YouTube des prédications du pasteur pour commencer à les écouter.<br><button class="btn" data-act="add">+ Ajouter des prédications</button></div>`;

function viewHome() {
  let h = `<header class="top">${LOGO}<div><h1>Soleil Couchant</h1><small>${PASTOR}</small></div></header>`;
  if (!sermons.length) return h + emptyBlock;
  const latest = sermons[0];
  h += `<div class="hero" data-play="${esc(latest.id)}" style="cursor:pointer"><div class="img" ${thumb(latest)}></div><div class="shade"></div>
    <div class="in"><div class="tag">Dernière prédication</div><div class="ht">${esc(latest.title)}</div><span class="btn">${I.play} Écouter</span></div></div>`;
  const cont = sermons.filter(s => pct(s.id) > 1 && pct(s.id) < 98 && pos(s.id) > 5);
  if (cont.length) {
    h += `<h2 class="sec"><span>Continuer l'<span class="serif">écoute</span></span></h2><div class="hscroll">` +
      cont.map(s => `<button class="hcard" data-play="${esc(s.id)}"><div class="th" ${thumb(s)}></div><div class="rt">${esc(s.title)}</div><div class="prog"><i style="width:${pct(s.id)}%"></i></div><div class="rs">Reprendre à ${fmt(pos(s.id))}</div></button>`).join('') + '</div>';
  }
  h += `<h2 class="sec"><span><span class="serif">Nouveautés</span></span><button data-tab="search">Voir tout</button></h2><div class="list">${sermons.slice(0, 8).map(s => row(s)).join('')}</div>`;
  return h;
}
function viewSearch() {
  const q = query.trim().toLowerCase();
  const res = q ? sermons.filter(s => s.title.toLowerCase().includes(q)) : sermons;
  return `<header class="top">${LOGO}<div><h1>Recherche</h1><small>${sermons.length} prédication${sermons.length > 1 ? 's' : ''}</small></div></header>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Un titre, un thème…" value="${esc(query)}" autocomplete="off"></div>
    <div class="list" id="results">${res.length ? res.map(s => row(s)).join('') : (sermons.length ? '<div class="empty">Aucun résultat.</div>' : emptyBlock)}</div>`;
}
function viewLib() {
  if (libView) {
    const ids = libView === 'fav' ? favs : history;
    const items = ids.map(byId).filter(Boolean);
    return `<header class="top"><button class="btn ghost" data-act="libback">‹ Retour</button><h1 style="margin-left:6px">${libView === 'fav' ? 'Favoris' : 'Historique'}</h1></header>
      <div class="list" style="margin-top:12px">${items.length ? items.map(s => row(s)).join('') : '<div class="empty">Rien ici pour le moment.</div>'}</div>`;
  }
  const cont = sermons.filter(s => pct(s.id) > 1 && pct(s.id) < 98 && pos(s.id) > 5);
  return `<header class="top">${LOGO}<div><h1>Bibliothèque</h1><small>Ton espace d'écoute</small></div></header>
    <div class="tiles" style="margin-top:14px">
      <button class="tile" data-lib="fav"><div class="ti" style="background:#e0556b">${I.heart.replace('<svg', '<svg style="fill:#fff"')}</div><b>Favoris</b><small>${favs.filter(byId).length} contenu(s)</small></button>
      <button class="tile" data-lib="hist"><div class="ti" style="background:#3b82c4">${I.hist}</div><b>Historique</b><small>${history.filter(byId).length} écoute(s)</small></button>
      <button class="tile off" data-act="soon"><div class="ti" style="background:#d08a2e">${I.dl}</div><b>Téléchargements</b><small>Bientôt</small></button>
      <button class="tile off" data-act="soon"><div class="ti" style="background:#2fa37a">${I.list}</div><b>Playlists</b><small>Bientôt</small></button>
    </div>
    <h2 class="sec"><span>Continuer l'<span class="serif">écoute</span></span></h2>
    <div class="list">${cont.length ? cont.map(s => row(s)).join('') : '<div class="empty" style="padding:20px">Tes écoutes en cours apparaîtront ici.</div>'}</div>`;
}
function viewSet() {
  return `<header class="top">${LOGO}<div><h1>Réglages</h1><small>Soleil Couchant</small></div></header>
    <div class="set" style="margin-top:14px">
      <button data-act="add"><span>Ajouter des prédications</span><span class="v">+</span></button>
      <button data-act="rate"><span>Vitesse de lecture par défaut</span><span class="v">${settings.rate}x</span></button>
      <button data-act="channel"><span>Chaîne YouTube du pasteur</span><span class="v">Ouvrir ↗</span></button>
      <button data-act="clear"><span style="color:#ff8f8f">Vider la liste</span></button>
    </div>
    <p class="about"><span class="serif" style="font-size:20px">Soleil Couchant Tabernacle</span><br>Les prédications du ${PASTOR}, à écouter où que tu sois.<br>Version 1 · Français</p>`;
}
function render() {
  const keepQ = document.activeElement && document.activeElement.id === 'q';
  $('#app').innerHTML = { home: viewHome, search: viewSearch, lib: viewLib, set: viewSet }[tab]();
  renderTabs();
  if (keepQ) { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

/* ---------- ÉVÉNEMENTS ---------- */
document.addEventListener('click', e => {
  const fav = e.target.closest('[data-fav]');
  if (fav) { e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
  const pl = e.target.closest('[data-play]');
  if (pl) { openSermon(pl.dataset.play); return; }
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; libView = null; render(); scrollTo(0, 0); return; }
  const lb = e.target.closest('[data-lib]');
  if (lb) { libView = lb.dataset.lib; render(); return; }
  const a = e.target.closest('[data-act]');
  if (a) {
    const k = a.dataset.act;
    if (k === 'add') openDialog();
    else if (k === 'libback') { libView = null; render(); }
    else if (k === 'soon') toast('Bientôt disponible');
    else if (k === 'rate') { settings.rate = RATES[(RATES.indexOf(settings.rate) + 1) % RATES.length]; saveAll(); render(); }
    else if (k === 'channel') window.open(CHANNEL, '_blank', 'noopener');
    else if (k === 'clear' && confirm('Vider toute la liste de prédications ?')) { stopAll(); sermons = []; favs = []; history = []; saveAll(); render(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { query = e.target.value; const q = query.trim().toLowerCase(); const res = q ? sermons.filter(s => s.title.toLowerCase().includes(q)) : sermons; $('#results').innerHTML = res.length ? res.map(s => row(s)).join('') : '<div class="empty">Aucun résultat.</div>'; }
});
function toggleFav(id) {
  favs = favs.includes(id) ? favs.filter(x => x !== id) : [id, ...favs];
  saveAll(); render(); renderQueue(); updateFavBtn();
}

/* ---------- MOTEURS DE LECTURE ---------- */
let ytReady = false, ytQueue = [];
window.onYouTubeIframeAPIReady = () => { ytReady = true; ytQueue.forEach(f => f()); ytQueue = []; };
function loadYT() {
  if (window.YT && YT.Player) { ytReady = true; return; }
  if (document.getElementById('ytapi')) return;
  const s = document.createElement('script'); s.id = 'ytapi'; s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
}
function makeYT(item, start) {
  return new Promise(res => {
    const go = () => {
      $('#media').innerHTML = '<div id="yt"></div>';
      let p;
      const wrap = {
        play: () => p.playVideo(), pause: () => p.pauseVideo(), seek: t => p.seekTo(t, true),
        time: () => (p.getCurrentTime && p.getCurrentTime()) || 0,
        dur: () => (p.getDuration && p.getDuration()) || 0,
        rate: r => p.setPlaybackRate(r),
        destroy: () => { try { p.destroy() } catch {} }
      };
      p = new YT.Player('yt', {
        videoId: item.yt, width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, autoplay: 1, start: Math.floor(start) },
        events: { onReady: () => res(wrap), onStateChange: e => { setPlaying(e.data === 1); if (e.data === 0) ended(); } }
      });
    };
    ytReady ? go() : (loadYT(), ytQueue.push(go));
  });
}
function makeAudio(item, start) {
  const a = new Audio(item.audio);
  a.preload = 'metadata';
  a.addEventListener('loadedmetadata', () => { if (start) a.currentTime = start; }, { once: true });
  a.onplay = () => setPlaying(true); a.onpause = () => setPlaying(false); a.onended = () => { setPlaying(false); ended(); };
  $('#media').innerHTML = `<div class="cover">${SUN}</div>`;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: item.title, artist: PASTOR, album: 'Soleil Couchant' });
    navigator.mediaSession.setActionHandler('play', () => a.play());
    navigator.mediaSession.setActionHandler('pause', () => a.pause());
    navigator.mediaSession.setActionHandler('seekbackward', () => a.currentTime -= 15);
    navigator.mediaSession.setActionHandler('seekforward', () => a.currentTime += 15);
    navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
    navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
  }
  return Promise.resolve({
    play: () => a.play(), pause: () => a.pause(), seek: t => a.currentTime = t,
    time: () => a.currentTime, dur: () => a.duration || 0, rate: r => a.playbackRate = r,
    destroy: () => { a.pause(); a.removeAttribute('src'); a.load(); }
  });
}

function persist() {
  if (!engine || !current) return;
  const t = engine.time(), d = engine.dur();
  if (d) LS.set('sc_dur_' + current.id, d);
  LS.set('sc_pos_' + current.id, d && t > d - 10 ? 0 : t);
}
function stopAll() {
  persist();
  if (engine) engine.destroy();
  engine = null; current = null; setPlaying(false);
  $('#mini').style.display = 'none'; $('#full').classList.remove('open'); $('#media').innerHTML = '';
}
function ended() {
  if (current) LS.set('sc_pos_' + current.id, 0);
  if (repeat && engine) { engine.seek(0); engine.play(); return; }
  step(1);
}
function step(dir) {
  if (!current) return;
  const i = sermons.findIndex(s => s.id === current.id);
  // la liste est de la plus récente à la plus ancienne : « suivante » = la suivante dans la liste
  const n = sermons[i + dir];
  if (n) openSermon(n.id, true);
}

async function openSermon(id, keepOpen) {
  const item = byId(id); if (!item) return;
  if (current && current.id === item.id && engine) { $('#full').classList.add('open'); return; }
  persist();
  if (engine) { engine.destroy(); engine = null; }
  current = item; playing = false;
  history = [item.id, ...history.filter(x => x !== item.id)].slice(0, 50); saveAll();
  $('#ftitle').textContent = item.title; $('#miniT').textContent = item.title;
  $('#miniTh').style.backgroundImage = item.yt ? `url('https://i.ytimg.com/vi/${item.yt}/mqdefault.jpg')` : '';
  $('#note').textContent = item.audio ? 'La lecture continue écran éteint.' : 'Garde l\'application ouverte pour continuer l\'écoute. L\'écoute écran éteint viendra avec les fichiers audio.';
  $('#mini').style.display = 'flex'; $('#full').classList.add('open');
  renderQueue(); updateFavBtn(); setPlaying(false);
  const e = await (item.audio ? makeAudio : makeYT)(item, pos(item.id));
  if (current !== item) { e.destroy(); return; }
  engine = e; engine.rate(settings.rate); updateRate();
  if (item.audio) engine.play();
  render();
}
function renderQueue() {
  if (!current) return;
  const i = sermons.findIndex(s => s.id === current.id);
  const next = sermons.slice(i + 1, i + 9);
  $('#queue').innerHTML = (current ? row(current, 'En cours de lecture') : '') + next.map(s => row(s)).join('');
}
function updateFavBtn() {
  if (!current) return;
  const on = favs.includes(current.id);
  $('#favBtn').textContent = (on ? '♥' : '♡') + ' Favori'; $('#favBtn').classList.toggle('on', on);
}
function updateRate() { $('#rate').textContent = 'Vitesse ' + settings.rate + 'x'; }

function setPlaying(p) {
  playing = p;
  $('#play').innerHTML = p ? I.pause : I.play;
  $('#miniPlay').innerHTML = p ? I.pause : I.play;
  document.querySelectorAll('.row.cur .th').forEach(th => { th.innerHTML = p ? '<div class="eq"><i></i><i></i><i></i></div>' : ''; });
  if (!p) persist();
}
setPlaying(false); updateRate();

const toggle = () => { if (!engine) return; playing ? engine.pause() : engine.play(); };
$('#play').onclick = toggle; $('#miniPlay').onclick = toggle;
$('#back').onclick = () => engine && engine.seek(Math.max(0, engine.time() - 15));
$('#fwd').onclick = () => engine && engine.seek(engine.time() + 15);
$('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
$('#miniOpen').onclick = $('#miniTh').onclick = () => $('#full').classList.add('open');
$('#close').onclick = () => { $('#full').classList.remove('open'); render(); };
$('#favBtn').onclick = () => current && toggleFav(current.id);
$('#rate').onclick = () => {
  settings.rate = RATES[(RATES.indexOf(settings.rate) + 1) % RATES.length]; saveAll();
  updateRate(); if (engine) engine.rate(settings.rate);
};
$('#rep').onclick = () => { repeat = !repeat; $('#rep').classList.toggle('on', repeat); };
const SLEEPS = [0, 15, 30, 60];
$('#sleep').onclick = () => {
  sleepI = (sleepI + 1) % SLEEPS.length;
  const m = SLEEPS[sleepI]; sleepAt = m ? Date.now() + m * 60000 : 0;
  $('#sleep').textContent = m ? 'Minuteur ' + m + ' min' : 'Minuteur'; $('#sleep').classList.toggle('on', !!m);
};
let dragging = false;
$('#seek').addEventListener('input', () => { dragging = true; const d = engine ? engine.dur() : 0; $('#tcur').textContent = fmt($('#seek').value / 1000 * d); });
$('#seek').addEventListener('change', () => { if (engine) engine.seek($('#seek').value / 1000 * engine.dur()); dragging = false; });

let lastSave = 0;
setInterval(() => {
  if (!engine || !current) return;
  const t = engine.time(), d = engine.dur();
  if (!dragging && d) { $('#seek').value = t / d * 1000; $('#tcur').textContent = fmt(t); }
  $('#tdur').textContent = fmt(d); $('#miniBar').style.width = d ? (t / d * 100) + '%' : '0';
  if (playing && Date.now() - lastSave > 5000) { persist(); lastSave = Date.now(); }
  if (sleepAt && Date.now() > sleepAt) { engine.pause(); sleepAt = 0; sleepI = 0; $('#sleep').textContent = 'Minuteur'; $('#sleep').classList.remove('on'); }
}, 500);
addEventListener('pagehide', persist);

/* ---------- AJOUT ---------- */
const dlg = $('#dlg');
function openDialog() { $('#urls').value = ''; dlg.showModal(); }
$('#cancel').onclick = () => dlg.close();
$('#save').onclick = async () => {
  const lines = $('#urls').value.split('\n').map(l => l.trim()).filter(Boolean);
  const seen = new Set();
  const entries = lines.map(l => { const m = l.match(/^(\S+)\s*(.*)$/); return { id: ytId(m[1]), title: m[2].trim() }; })
    .filter(e => e.id && !byId(e.id) && !seen.has(e.id) && seen.add(e.id));
  if (!entries.length) { toast(lines.length ? 'Lien(s) non reconnu(s) ou déjà ajouté(s)' : 'Colle au moins un lien'); return; }
  $('#save').disabled = true; $('#save').textContent = 'Ajout…';
  const added = await Promise.all(entries.map(async ({ id, title }) => {
    if (!title) {
      try {
        const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id));
        title = (await r.json()).title;
      } catch {}
    }
    return { id, yt: id, title: title || 'Prédication' };
  }));
  sermons = [...added, ...sermons]; saveAll();
  $('#save').disabled = false; $('#save').textContent = 'Ajouter';
  dlg.close(); render(); toast(added.length + ' prédication' + (added.length > 1 ? 's ajoutées' : ' ajoutée'));
};

render();
</script>
</body>
</html>

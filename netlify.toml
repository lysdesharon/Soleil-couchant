[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Le service worker, la page et le catalogue doivent toujours être revérifiés,
# pour que les mises à jour arrivent chez tout le monde.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sermons.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Les fichiers audio ne changent pas : cache long.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
